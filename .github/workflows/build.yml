# Builds, tests, and containerizes the template. The semantic version is calculated by MinVer from
# git tags (see source/Directory.Build.props and the README's Versioning section):
#   - push to main / pull request  -> pre-release version, e.g. 1.4.1-alpha.0.3
#   - push a tag like v1.4.0       -> release version 1.4.0
# Images are built with that version but not pushed; add a registry login and push step to publish.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # MinVer needs the tags and commit history; the default shallow clone would make every
      # build look untagged.
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore source/ONIONARCH.sln

      - name: Build
        run: dotnet build source/ONIONARCH.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test source/ONIONARCH.sln --configuration Release --no-build

      # Every project gets the same version, so reading it from one project is enough.
      - name: Read calculated version
        id: version
        run: |
          version=$(dotnet msbuild source/ONIONARCH.Domain/ONIONARCH.Domain.csproj -t:MinVer -getProperty:Version -p:Configuration=Release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: ONIONARCH.Presentation.API
            image: onionarch-api
          - project: ONIONARCH.Presentation.Web
            image: onionarch-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Docker build context has no .git, so the version calculated above is passed in.
      - name: Build image
        run: >
          docker build source
          --file source/${{ matrix.project }}/Dockerfile
          --build-arg APP_VERSION=${{ needs.build.outputs.version }}
          --tag ${{ matrix.image }}:${{ needs.build.outputs.version }}

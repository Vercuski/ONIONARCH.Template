# Generates Markdown API documentation from the XML documentation comments (///) in the source with
# DocFX, then publishes it to the documentation repository, into a folder named after this
# repository, where GitHub renders it directly:
#
#   https://github.com/Vercuski/RepoDocumentation/tree/main/<this repo's name>/
#     README.md   landing page (from Documentation/DocFX/landing-page.md)
#     api/*.md    one page per namespace and type
#     images/     copied from Documentation/Images
#
# The DocFX configuration and the post-processor live in Documentation/DocFX. To generate the same
# output locally, run the two commands from the "Generate" steps below in that folder.
#
# One-time setup: the default GITHUB_TOKEN cannot write to another repository, so this workflow
# pushes with a fine-grained personal access token stored as the DOCS_REPO_TOKEN secret:
#   1. GitHub > Settings > Developer settings > Fine-grained tokens > Generate new token.
#      Repository access: only Vercuski/RepoDocumentation. Permissions: Contents = Read and write.
#   2. In this repository: Settings > Secrets and variables > Actions > New repository secret,
#      name DOCS_REPO_TOKEN.
#   RepoDocumentation's main branch must already exist (it needs at least one commit).
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One docs run per source repository at a time. A newer push supersedes an older run, so stale
# documentation can never overwrite newer documentation.
concurrency:
  group: docs-${{ github.repository }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOCFX_VERSION: 2.80.1
  DOCS_REPOSITORY: Vercuski/RepoDocumentation
  DOCS_BRANCH: main

jobs:
  docs:
    name: Build and publish API docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install --global docfx --version "$DOCFX_VERSION"

      # DocFX restores and loads each project in docfx.json with Roslyn and reads the /// comments
      # straight from the source; "outputFormat": "markdown" writes one .md page per namespace and
      # type to api/. --warningsAsErrors matches the solution's TreatWarningsAsErrors policy.
      - name: Generate Markdown API pages
        working-directory: Documentation/DocFX
        run: docfx metadata docfx.json --warningsAsErrors

      # DocFX's Markdown output leaves <see cref="..."/> references as raw <xref> tags, which
      # GitHub renders as blank text. PostProcess.cs (a .NET 10 file-based app) turns them into
      # links, adds the README.md landing page and images, and fails on any broken link or anchor.
      - name: Resolve cross-references and assemble output
        working-directory: Documentation/DocFX
        run: dotnet run PostProcess.cs

      - name: Checkout documentation repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DOCS_REPOSITORY }}
          ref: ${{ env.DOCS_BRANCH }}
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo

      - name: Publish to documentation repository
        env:
          TARGET_DIR: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Guard: an empty folder name would make the rsync below mirror onto the repo root.
          : "${TARGET_DIR:?repository name is empty}"

          # Mirror the site into this repo's folder only; --delete removes pages for types that no
          # longer exist. Other repositories' folders are never touched.
          mkdir -p "docs-repo/$TARGET_DIR"
          rsync -a --delete Documentation/DocFX/_site/ "docs-repo/$TARGET_DIR/"

          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- "$TARGET_DIR"

          if git diff --cached --quiet; then
            echo "Documentation is unchanged; nothing to publish."
            echo "Documentation unchanged; nothing published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit --quiet \
            -m "docs($TARGET_DIR): update from ${GITHUB_SHA::7}" \
            -m "Generated by DocFX from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

          # Other repositories publish to the same branch, so a push can be rejected when one of
          # them lands first. Each repo writes only its own folder, so rebasing never conflicts.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$DOCS_BRANCH"; then
              echo "### Documentation published" >> "$GITHUB_STEP_SUMMARY"
              echo "$GITHUB_SERVER_URL/$DOCS_REPOSITORY/tree/$DOCS_BRANCH/$TARGET_DIR" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt $attempt of 5); rebasing onto the latest $DOCS_BRANCH."
            sleep $((attempt * 5))
            git pull --rebase origin "$DOCS_BRANCH"
          done

          echo "::error::Could not push documentation to $DOCS_REPOSITORY after 5 attempts."
          exit 1
